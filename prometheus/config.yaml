global:
  scrape_interval: 15s

scrape_configs:
  # - job_name: 'prometheus'
  #   scrape_interval: 15s
  #   metrics_path: /prometheus/metrics
  #   static_configs:
  #     - targets: ['localhost:9090']

  - job_name: 'Node Exporter Full'
    scrape_interval: 5s
    static_configs:
    - targets: ['localhost:9100']

  - job_name: 'mcim-rust-api'
    scrape_interval: 5s
    static_configs:
    - targets: ['localhost:8080', "localhost:8081"]
    relabel_configs:
    - target_label: 'service'
      replacement: 'mcim-rust-api'

  - job_name: 'mcim-rust-sync'
    scrape_interval: 5s
    static_configs:
    - targets: ['localhost:9900']
    relabel_configs:
    - target_label: 'service'
      replacement: 'mcim-rust-sync'